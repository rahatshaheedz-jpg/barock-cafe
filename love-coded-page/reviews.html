    <style>
      body {
        background: #0B0705;
      }

      .review-steam span {
        animation: reviewSteam 6.4s ease-in-out infinite;
      }

      .review-steam span:nth-child(2) {
        animation-delay: 1.1s;
      }

      .review-steam span:nth-child(3) {
        animation-delay: 2.2s;
      }

      @keyframes reviewSteam {
        0%,
        100% {
          opacity: 0.18;
          transform: translateY(18px) translateX(0) rotate(0deg);
        }

        50% {
          opacity: 0.62;
        }

        78% {
          transform: translateY(-58px) translateX(18px) rotate(8deg);
        }
      }

      .fade-card {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 700ms ease, transform 700ms ease;
      }

      .fade-card.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
